{% extends "layout.html" %}
{% block content %}
<div class="card">
    <h2>⛓️ Деморган</h2>
    <div class="info-box">
        ℹ️ <strong>Функция:</strong> Автоматически ищет токаря и швейку, вычисляет время ожидания и выполняет клики.
    </div>
    <div class="settings-group">
        <div class="input-group">
            <label>Сигнал токаря: <span id="tokar_v">{{settings.tokar_pause}}</span>s</label>
            <input type="range" id="tokar_pause" min="30" max="120" step="1" value="{{settings.tokar_pause}}" oninput="document.getElementById('tokar_v').innerText=this.value">
        </div>

        <div class="input-group">
            <label>Сигнал швейки: <span id="shveika_v">{{settings.shveika_pause}}</span>s</label>
            <input type="range" id="shveika_pause" min="60" max="150" step="1" value="{{settings.shveika_pause}}" oninput="document.getElementById('shveika_v').innerText=this.value">
        </div>

        <div class="input-group">
            <label>Пауза швейки: <span id="shveika_exe_v">{{settings.shveika_exe}}</span>s</label>
            <input type="range" id="shveika_exe" min="0" max="2" step="0.1" value="{{settings.shveika_exe}}" oninput="document.getElementById('shveika_exe_v').innerText=this.value">
        </div>

        <button class="button" id="demorgan-btn" onclick="toggleDemorgan()">
            {{ 'Остановить' if active else 'Запустить' }}
        </button>
    </div>

    <h2>📋 Логи</h2>
    <div style="position: relative;">
        <div id="log-container"></div>
        <button onclick="sendLogsToTelegram(event)" class="floating-send-btn" title="Скопировать логи"><svg class="ico"><use href="#i-copy"/></svg></button>
    </div>
</div>

<div id="smoothing-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>⚠️ Сглаживание шрифтов выключено</h3>
        <p>Для корректной работы бота необходимо включить сглаживание шрифтов в Windows.</p>
        <div class="modal-buttons">
            <button class="button" onclick="enableSmoothing()">Включить</button>
            <button class="button" onclick="closeSmoothingModal()">Закрыть</button>
        </div>
    </div>
</div>

<script>
(function() {
    window.updatePageUI = function(active) {
        window.isDemorganActive = active;
        window.updateModuleUI('demorgan-btn', active);
    };

    window.toggleDemorgan = async function() {
        const settings = {
            tokar_pause: parseInt(document.getElementById('tokar_pause').value) || 65,
            shveika_pause: parseInt(document.getElementById('shveika_pause').value) || 85,
            shveika_exe: parseFloat(document.getElementById('shveika_exe').value) || 0.1
        };

        try {
            const res = await fetch('/api/demorgan/toggle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    active: !window.isDemorganActive,
                    settings: settings
                })
            });
            const data = await res.json();
            window.updatePageUI(data.active);
        } catch (err) {
            console.error("Ошибка Деморгана:", err);
        }
    };

    window.showSmoothingModal = function() {
        document.getElementById('smoothing-modal').style.display = 'flex';
    };

    window.closeSmoothingModal = function() {
        document.getElementById('smoothing-modal').style.display = 'none';
    };

    window.enableSmoothing = async function() {
        try {
            const res = await fetch('/api/demorgan/enable-smoothing', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            });
            const data = await res.json();

            if (data.success) {
                const modalContent = document.querySelector('.modal-content');
                modalContent.innerHTML = `
                    <h3>✅ Сглаживание включено</h3>
                    <p>Сглаживание шрифтов успешно включено. Для применения изменений необходимо перезапустить игру.</p>
                    <div class="modal-buttons">
                        <button class="button" onclick="closeSmoothingModal()">Закрыть</button>
                    </div>
                `;
            }
        } catch (err) {
            console.error("Ошибка при включении сглаживания:", err);
            alert("Не удалось включить сглаживание. Проверьте права администратора.");
        }
    };

    const serverStatus = "{{ 'true' if active else 'false' }}";
    window.updatePageUI(serverStatus === 'true');
    window.loadModuleLogs('demorgan');

    const smoothingWarning = "{{ 'true' if smoothing_warning else 'false' }}";
    if (smoothingWarning === 'true') {
        window.showSmoothingModal();
    }
})();
</script>
{% endblock %}
